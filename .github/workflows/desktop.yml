name: Desktop build
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@12.9.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Frontend type check and build
        run: pnpm build
      - name: Rust unit and database tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Build installer
        run: pnpm tauri:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: onTime-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: onTime-*
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}（预览版）
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            发布日期：2026-10-17

            - ✨️ 支持单次、重复与倒计时提醒；重复规则覆盖每天、每周、每月、每季度和每年，并可设置生效日期范围。
            - ✨️ 提醒到期时显示系统通知和响铃窗口；提醒、分组、标签及提醒历史保存在本地 SQLite，并支持历史筛选与分页。
            - ✨️ 支持每日自动备份并保留最近 7 份备份，托盘菜单可快速创建 10 或 30 分钟倒计时。
            - 🐛 修正重复提醒的月底与 31 号规则，并改善响铃窗口关闭时对并行提醒的处理。
            - 🎨 改进提醒表单、列表、设置和分组/标签管理界面。

            这是预览版本。首次使用或升级前，请先从“设置 → 备份”导出重要数据；遇到问题请通过 GitHub Issues 反馈。
          files: release-assets/**
          fail_on_unmatched_files: true
