name: Desktop build
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@12.9.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Frontend type check and build
        run: pnpm build
      - name: Frontend and update manifest tests
        run: node --test tests/*.test.mjs
      - name: Rust unit and database tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Build installer
        run: pnpm tauri:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: onTime-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare release notes
        id: notes
        run: node scripts/prepare-release.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: onTime-*
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          prerelease: ${{ steps.notes.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: release-assets/**
          fail_on_unmatched_files: true
