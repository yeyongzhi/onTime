title: v0.0.1-beta7
tag: v0.0.1-beta7
prerelease: true
body: |
  发布日期：2026-10-24

  - ✨️ 新增可修改的全局快捷键，启动后即可快速打开主面板；冲突时提示更换组合键。
  - ✨️ 新增通知方式选择与多款内置铃声，支持试听并在 3 秒后停止。
  - ✨️ 提醒历史支持批量删除已结束记录，并提供独立的查询、重置和管理操作栏。
  - 🎨 重新整理提醒筛选及设置页面布局，筛选条件在点击查询后生效，列表可查看提醒详情。
  - 🐛 修正关闭窗口时的托盘确认流程，并将关于页的更新日志入口放到操作区。

  > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。
