title: v0.0.1-beta8
tag: v0.0.1-beta8
prerelease: true
body: |
  发布日期：2026-10-24

  - ✨️ Windows 新增息屏/锁屏时延迟提醒设置；恢复使用电脑后汇总错过的提醒，关闭设置则沿用原有提醒方式。
  - ✨️ 重复提醒支持单个时间点与多个时间点，时间编辑区显示总数，并可使用统一的下拉选择器。
  - ✨️ 内置铃声以列表展示，提供试听与停止按钮；停止本次提醒时同步关闭弹窗和响铃。
  - 🐛 修复 Windows 自动更新后可能仍运行旧版本，以及全局快捷键注册失败的问题。
  - 🎨 优化提醒历史、分组和设置页面的筛选与布局，更新日志入口指向产品站。

  > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。
