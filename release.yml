title: v0.0.1-beta2（预览版）
tag: v0.0.1-beta2
prerelease: true
body: |
  发布日期：2026-10-20

  - ✨️ 首页新增未来 7 天与今日已处理概览，提醒和历史支持类型、分组、标签及日期筛选。
  - 🐛 修复失效提醒自动停用、开关状态显示、列表分页重置及历史筛选刷新问题，并提供失效原因说明。
  - 🎨 统一表格、分页、操作按钮和全宽布局；设置采用左右布局，展示方式可全局同步，分组标签支持自定义色盘。
  - 🎨 优化提醒弹窗，突出提醒时间、内容与处理按钮，窗口高度随内容适配并禁止手动缩放。
  - ⚡️ 补充状态映射与历史筛选边界验证，完善代码静态检查。

  这是预览版本。升级前请从“设置 → 备份”导出重要数据；遇到问题请通过 GitHub Issues 反馈。
