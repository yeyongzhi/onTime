[package]
name = "ontime"
version = "0.0.1-beta2"
description = "onTime cross-platform local alarm clock"
authors = ["yeyongzhi"]
license = ""
repository = "https://github.com/yeyongzhi/onTime"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }

chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
rodio = "0.22.2"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }

semver = "1"
